<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar Propietario | VetCare</title>
  <link rel="stylesheet" href="../../../css/estilos.css">
  <link rel="stylesheet" href="../../../css/paginas/propietarios.css">
</head>

<body>
  <header class="encabezado">
    <div class="contenedor encabezado__interior">
      <a class="marca" href="../menu-recepcionista.html">
        <span class="marca__simbolo">V</span>
        <span class="marca__texto">VetCare</span>
      </a>
      <div class="navegacion">
        <nav>
          <a href="../menu-recepcionista.html">Menú recepción</a>
          <a href="../../../index.html">Cerrar sesión</a>
        </nav>
        <div class="usuario-sesion">
          <div class="usuario-avatar" title="Camila Silva">
            C
          </div>
          <div class="usuario-info">
            <span class="usuario-nombre">Camila Silva</span>
            <span class="usuario-rol">Recepcionista</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="contenedor seccion-principal">
    <div class="encabezado-pagina">
      <p class="texto-secundario">Propietarios &gt; Editar</p>
      <h1 class="titulo-pagina">Editar Propietario</h1>
      <p class="texto-secundario">Modifica los datos del registro de María Fernanda Torres Salgado.</p>
    </div>

    <!-- Formulario con datos cargados -->
    <form class="tarjeta panel formulario" action="propietarios-listado.html" method="get">
      <fieldset class="cuadricula cuadricula--dos">
        <legend class="etiqueta">Datos Personales</legend>

        <div class="campo">
          <label for="cedula">Cédula de Identidad</label>
          <input id="cedula" name="cedula" type="text" maxlength="10" value="0105489632" required>
        </div>

        <div class="campo">
          <label for="celular">Teléfono Celular</label>
          <input id="celular" name="celular" type="tel" maxlength="10" value="0998451230" required>
        </div>

        <div class="campo">
          <label for="nombres">Nombres</label>
          <input id="nombres" name="nombres" type="text" value="María Fernanda" required>
        </div>

        <div class="campo">
          <label for="apellidos">Apellidos</label>
          <input id="apellidos" name="apellidos" type="text" value="Torres Salgado" required>
        </div>

        <div class="campo">
          <label for="correo">Correo Electrónico</label>
          <input id="correo" name="correo" type="email" value="maria.torres@gmail.com" required>
        </div>

        <div class="campo">
          <label for="direccion">Dirección Domiciliaria</label>
          <input id="direccion" name="direccion" type="text" value="Av. 12 de Octubre y Cordero, Edif. Los Pinos #4B"
            required>
        </div>
      </fieldset>

      <div class="botonera">
        <button class="boton" type="submit">Guardar cambios</button>
        <a class="boton boton--secundario" href="propietarios-listado.html">Cancelar</a>
      </div>
    </form>
  </main>

  <footer class="contenedor pie">
    VetCare · Clínica Veterinaria Huellitas
  </footer>
</body>

</html>
