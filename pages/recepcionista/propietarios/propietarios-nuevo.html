<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar propietario | VetCare</title>
  <link rel="stylesheet" href="../../../css/estilos.css">
  <link rel="stylesheet" href="../../../css/paginas/propietarios.css">
</head>

<body>
  <main class="contenedor seccion-principal popup-propietario">
    <div class="encabezado-pagina">
      <p class="texto-secundario">Propietarios &gt; Nuevo</p>
      <h1 class="titulo-pagina">Registrar Propietario</h1>
      <p class="texto-secundario">Completa los datos personales del responsable de la mascota para darlo de alta en el
        sistema.</p>
    </div>

    <!-- Formulario de registro -->
    <form class="tarjeta panel formulario" action="propietarios-listado.html" method="get" target="_top">
      <fieldset class="cuadricula cuadricula--tres">
        <legend class="etiqueta">Datos Personales</legend>

        <div class="campo">
          <label for="cedula">Cédula de Identidad</label>
          <input id="cedula" name="cedula" type="text" maxlength="10" placeholder="Ej. 0912345678" required>
        </div>

        <div class="campo">
          <label for="celular">Teléfono Celular</label>
          <input id="celular" name="celular" type="tel" maxlength="10" placeholder="Ej. 0991234567" required>
        </div>

        <div class="campo">
          <label for="nombres">Nombres</label>
          <input id="nombres" name="nombres" type="text" placeholder="Ej. María Fernanda" required>
        </div>

        <div class="campo">
          <label for="apellidos">Apellidos</label>
          <input id="apellidos" name="apellidos" type="text" placeholder="Ej. Pérez Torres" required>
        </div>

        <div class="campo">
          <label for="correo">Correo Electrónico</label>
          <input id="correo" name="correo" type="email" placeholder="usuario@correo.com" required>
        </div>

        <div class="campo">
          <label for="direccion">Dirección Domiciliaria</label>
          <input id="direccion" name="direccion" type="text" placeholder="Ej. Av. América y Shyris #104" required>
        </div>
      </fieldset>

      <div class="botonera">
        <button class="boton" type="submit">Guardar propietario</button>
        <a class="boton boton--secundario" href="propietarios-listado.html" target="_top">Cancelar</a>
      </div>
    </form>
  </main>
</body>

</html>
